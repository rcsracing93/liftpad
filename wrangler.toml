# LiftPad Worker config. The three __LP_...__ values are placeholders.
# tools/deploy.sh fills them in a build copy from deploy.env and the D1 lookup.
# Do not put real values in this file.
name = "liftpad"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false
routes = [ { pattern = "__LP_HOSTNAME__", custom_domain = true } ]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# true: every request runs the Worker first, so a browser navigation to /api/* gets JSON.
# The Worker passes every other path to ASSETS (SPA fallback kept). wrangler 3.114 has no array form.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "__LP_D1_NAME__"
database_id = "__LP_D1_ID__"

# Private R2 bucket (no public access): ALI page images ali/<edition>/p<NNN>.jpg, later the
# door-jamb photos. Served only by the Worker, behind Access.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "liftpad-private"

[vars]
NHTSA = "https://vpic.nhtsa.dot.gov/api/vehicles"
# fueleconomy.gov web service (HANDOFF 17): the year, make, model, engine lists. The Worker fetches it and caches the answers in D1 (fe_menu).
FE = "https://www.fueleconomy.gov/ws/rest/vehicle"
# NHTSA recalls (HANDOFF 18): recallsByVehicle, asked once a day per car. The Worker caches the answer in D1 (car_facts).
RECALLS = "https://api.nhtsa.gov/recalls"
# Research job by itself when Rick adds a car or changes a trim: "1" = on. Default off; tools/deploy.sh sets it from deploy.env.
LP_AUTO_RESEARCH = "0"

# HANDOFF 14: the review environment (`wrangler deploy --env review`, run by tools/review/review_env.sh). Same code, its own
# name, D1 and R2, no research key, no processor token. The placeholders start with __LPR_ (not __LP_) on purpose: the guard of
# tools/deploy.sh greps for a quoted __LP_ and must not see these. A live deploy (no --env) ignores this block.
[env.review]
name = "liftpad-review"
workers_dev = false
preview_urls = false
routes = [ { pattern = "__LPR_HOSTNAME__", custom_domain = true } ]

[env.review.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.review.d1_databases]]
binding = "DB"
database_name = "liftpad-review"
database_id = "__LPR_D1_ID__"

[[env.review.r2_buckets]]
binding = "BUCKET"
bucket_name = "liftpad-review-private"

[env.review.vars]
NHTSA = "https://vpic.nhtsa.dot.gov/api/vehicles"
FE = "https://www.fueleconomy.gov/ws/rest/vehicle"
RECALLS = "https://api.nhtsa.gov/recalls"
# Always "0" in review: no Anthropic key exists there.
LP_AUTO_RESEARCH = "0"
